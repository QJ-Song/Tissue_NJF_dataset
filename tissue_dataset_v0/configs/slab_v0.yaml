dataset:
  output_dir: ../outputs/yaml_slab_v0
  num_samples: 3
  sample_id_start: 1
  seed: 42

backend:
  type: toy_press

geometry:
  size_x: 0.10
  size_y: 0.10
  thickness: 0.01
  nx: 24
  ny: 24
  layers: 2
  fixed_border_ratio: 0.12

material_sampler:
  type: uniform
  youngs_modulus: [5000.0, 50000.0]
  poisson_ratio: [0.40, 0.49]
  density: 1000.0
  damping: [0.1, 2.0]
  boundary_condition: bottom_fixed

action_sampler:
  type: uniform_press
  contact_margin: 0.03
  depth: [0.002, 0.010]

logging:
  enabled: true
  log_dir_name: logs
  log_every_n: 10
  save_vertices: true
  save_tool_pose: false
  save_events: true
  save_request: true

artifacts:
  include: null
  exclude: []
