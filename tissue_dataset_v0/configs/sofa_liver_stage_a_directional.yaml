dataset:
  output_dir: ../outputs/sofa_liver_stage_a_directional_30deg
  num_samples: 5
  sample_id_start: 1
  seed: 127

backend:
  type: sofa_fem
  extra:
    sofa_tissue_shape: liver_like
    sofa_total_steps: 180
    sofa_dt: 0.01
    sofa_load_model: localized_probe_force
    sofa_probe_radius: 0.022
    sofa_probe_force_scale: 3.2
    sofa_probe_max_force: 5.0

geometry:
  size_x: 0.12
  size_y: 0.085
  thickness: 0.018
  nx: 8
  ny: 6
  layers: 4
  fixed_border_ratio: 0.12

material_sampler:
  type: uniform
  youngs_modulus: [5000.0, 5000.0]
  poisson_ratio: [0.45, 0.45]
  density: 1000.0
  damping: [0.5, 0.5]
  boundary_condition: bottom_fixed

action_sampler:
  type: uniform_press
  contact_margin: 0.026
  depth: [0.004, 0.009]
  direction_mode: upper_hemisphere_cone
  max_tilt_deg: 30

logging:
  enabled: true
  log_dir_name: logs
  log_every_n: 10
  save_vertices: true
  save_tool_pose: false
  save_events: true
  save_request: true

artifacts:
  include: null
  exclude: []
