dataset:
  output_dir: ../outputs/sofa_slab_v0
  num_samples: 1
  sample_id_start: 1
  seed: 42

backend:
  type: sofa_fem

geometry:
  size_x: 0.10
  size_y: 0.10
  thickness: 0.01
  nx: 5
  ny: 5
  layers: 3
  fixed_border_ratio: 0.12

material_sampler:
  type: uniform
  youngs_modulus: [5000.0, 5000.0]
  poisson_ratio: [0.45, 0.45]
  density: 1000.0
  damping: [0.5, 0.5]
  boundary_condition: bottom_fixed

action_sampler:
  type: uniform_press
  contact_margin: 0.02
  depth: [0.008, 0.008]

logging:
  enabled: true
  log_dir_name: logs
  log_every_n: 10
  save_vertices: true
  save_tool_pose: false
  save_events: true
  save_request: true

artifacts:
  include: null
  exclude: []
